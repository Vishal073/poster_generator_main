services:
  - type: web
    name: poster-backend
    runtime: node
    rootDir: my-backend
    buildCommand: apt-get update && apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev && npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://admin.gcrgraphix.com
      - key: API_BASE_URL
        value: https://api.gcrgraphix.com
      - key: CORS_ORIGINS
        value: https://admin.gcrgraphix.com,https://gcrgraphix.com,https://www.gcrgraphix.com,https://poster-generator-admin-portal.onrender.com,http://localhost:5173
